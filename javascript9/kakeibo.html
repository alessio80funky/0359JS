<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kakeibo App</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
</head>
<body>

    <div class="container">

        <div class="summary">
            <div class="summary-item">
                <span class="label">収入</span>
                <span class="amount income" id="totalIncome">0</span>
            </div>
            <div class="summary-item">
                 <span class="label">支出</span>
                 <span class="amount expense" id="totalExpense">0</span>
            </div>
            <div class="summary-item">
                 <span class="label">合計</span>
                 <span class="amount balance" id="balance">0</span>
            </div>
        </div>

        <div class="form-container">
            <form id="transactionForm">
                <div class="form-group">
                    <label for="description">取引の内容：</label>
                    <input type="text" id="description" required>
                </div>
                <div class="form-group">
                    <label for="amount">取引の金額：</label>
                    <input type="text" id="amount" required>
                </div>
                <div class="form-group">
                    <label for="type">取引の種類：</label>
                    <select id="type">
                        <option value="expense">支出</option>
                        <option value="income">収入</option>
                    </select>
                </div>
                <button class="btn-submit">追加</button>
            </form>
        </div>


        <div class="transaction-container"> 
            <h2>取引履歴</h2>
            <ul class="transaction-list" id="transactionList"></ul>
        </div>

        <div class="chart-container" id="chartContainer">
            <h1>タイトル</h1>
            <canvas id="Chart" width="400" height="200"></canvas>
            <button id="btn" class="btn-submit">表示</button>
            <button>🔃</button>
        </div>

    </div>
    
    <script>
        ///合計セクション
        const totalIncomeEl = document.getElementById("totalIncome");
        const totaleExpense = document.getElementById("totalExpense");
        const balanceEl = document.getElementById("balance");
        //フォームセクション
        const form = document.getElementById("transactionForm");
        const descInput = document.getElementById("description");
        const amountInput = document.getElementById("amount");
        const selectInput = document.getElementById("type");
        //取引履歴セクション
        const transList = document.getElementById("transactionList");
        //グラフ
        const $ = id => document.getElementById(id);

        const STORAGE_KEY = "kakekibo_260810";

        let transactions = [];

        function init(){
            form.addEventListener("submit",Submit)

            updateUI();
        }
        init();

        function loadTransactions(){
            const stored = localStorage.getItem(STORAGE_KEY);
            if(stored){
                transactions = JSON.parse(stored)
            }
        };

        function saveTransactions(){
            localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions))
        };

        function Submit(e){
            e.preventDefault();

            const description = descInput.value;
            const amount = amountInput.value;
            const type = selectInput.value;

            if(!description || !amount || amount <= 0){
                alert("正しい内容を入力");
                return;
            }

            const transaction = {
                id: Date.now(),
                description,
                amount,
                type,
                date: new Date().toLocaleString("ja-JP")
            }

            transactions.unshift(transaction);
            saveTransactions();
            updateUI();
            form.reset();
        }

        function deleteTransaction(id){
            transactions = transactions.filter(t => t.id !== id);
            saveTransactions();
            updateUI();
        }

        function updateUI(){
            updateTransactionList();
            updateSummary();
        }

        function updateTransactionList(){
            transList.innerHTML = "";

            transactions.forEach(transaction => {
                
            const list = document.createElement("li");
            list.className = `transaction-item ${transaction.type}`; 
                                                // 値　　　if true else false
            const symbol = transactions.type === "income"  ? "+" : "-";
            
              list.innerHTML=`<div class="transaction-info">
                <div class="transaction-description">${transaction.description}</div>
                <small style="color: #999;">${transaction.date}</small>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span class="transaction-amount ${transaction.type}">
                    ${symbol}¥${transaction.amount.toLocaleString()}
                </span>
                <button class="btn-delete" onclick="deleteTransaction(${transaction.id})">削除</button>
            </div>`;  

            transList.appendChild(list);

            })

          
        }

        function updateSummary(){

            const income = transactions.filter(t => t.id === "income").reduce((sum, t) => sum + t.amount, 0);
            const expense = transactions.filter(t => t.id === "expense").reduce((sum, t) => sum + t.amount, 0);

            const balance = income - expense;

            totalIncomeEl.textContent = `${income.toLocaleString()}`;
            totaleExpense.textContent = `${expense.toLocaleString()}`;
            balanceEl.textContent = `${balance.toLocaleString()}`;

            if(balance > 0){
                balanceEl.style.color = "green";
            }else if (balance < 0) {
                balanceEl.style.color = "red";
            }else{
                balanceEl.style.color = "blue";
            }



        }

    </script>
</body>
</html>
